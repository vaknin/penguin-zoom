<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Penguin for Zoom spike</title>
<style>
  :root { color-scheme: dark; --bg:#14161a; --panel:#1e2127; --fg:#e6e6e6; --dim:#8a8f98; --ok:#5bd17a; --bad:#ff6b6b; --warn:#f0c04a; --acc:#4a8cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  header { padding:10px 16px; display:flex; gap:12px; align-items:center; border-bottom:1px solid #2a2e36; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #auth { margin-left:auto; color:var(--dim); }
  main { display:grid; grid-template-columns: 300px 1fr; gap:12px; padding:12px; height:calc(100vh - 46px); }
  aside { overflow:auto; display:flex; flex-direction:column; gap:12px; }
  section { background:var(--panel); border-radius:8px; padding:10px 12px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; font:12px ui-monospace, monospace; }
  td { padding:1px 0; vertical-align:top; } td:last-child { text-align:right; word-break:break-all; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  label { display:block; font-size:12px; color:var(--dim); margin-top:6px; }
  input { width:100%; padding:6px 8px; background:#111317; color:var(--fg); border:1px solid #333842; border-radius:5px; }
  button { margin-top:8px; padding:6px 10px; background:var(--acc); color:white; border:0; border-radius:5px; cursor:pointer; }
  button.secondary { background:#3a3f4a; }
  button:disabled { opacity:.5; cursor:default; }
  video { width:100%; border-radius:6px; background:black; aspect-ratio:16/9; }
  #meter { height:8px; background:#111317; border-radius:4px; overflow:hidden; margin-top:6px; }
  #meter div { height:100%; width:0; background:var(--ok); transition:width .05s; }
  #stage { background:var(--panel); border-radius:8px; position:relative; overflow:hidden; }
  #zoomRoot { width:100%; height:100%; }
  #log { font:11px ui-monospace, monospace; max-height:180px; overflow:auto; white-space:pre-wrap; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Penguin for Zoom: spike</h1>
  <span id="sdkver" class="warn"></span>
  <span id="auth">…</span>
</header>
<main>
  <aside>
    <section>
      <h2>Join</h2>
      <label>Meeting number or link</label>
      <input id="meeting" placeholder="123 456 7890 or https://us02web.zoom.us/j/…?pwd=…">
      <label>Passcode</label>
      <input id="passcode" autocomplete="off">
      <label>Display name</label>
      <input id="name" value="Linux spike">
      <button id="join">Join</button>
      <button id="leave" class="secondary" disabled>Leave</button>
      <button id="signin" class="secondary">Sign in (ZAK)</button>
    </section>
    <section>
      <h2>Local capture</h2>
      <video id="preview" autoplay muted playsinline></video>
      <div id="meter"><div></div></div>
      <button id="capture" class="secondary">Test camera + mic</button>
      <button id="share" class="secondary">Test screen capture</button>
    </section>
    <section>
      <h2>Diagnostics</h2>
      <table id="diag"></table>
    </section>
    <section>
      <h2>Log</h2>
      <div id="log"></div>
    </section>
  </aside>
  <div id="stage"><div id="zoomRoot"></div></div>
</main>

<script src="/screencast.js"></script>
<script src="/spike.js?phase=pre"></script>
<script src="/sdk/lib/vendor/react.min.js"></script>
<script src="/sdk/lib/vendor/react-dom.min.js"></script>
<script src="/sdk/lib/vendor/redux.min.js"></script>
<script src="/sdk/lib/vendor/redux-thunk.min.js"></script>
<script src="/sdk/lib/vendor/react-redux.min.js"></script>
<script src="/sdk/lib/vendor/lodash.min.js"></script>
<script src="/sdk/zoom-meeting-embedded-6.10.0.min.js"></script>
<script>window.spikeMain && window.spikeMain();</script>
</body>
</html>
